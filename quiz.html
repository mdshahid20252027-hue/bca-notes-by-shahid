<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>Smart Quiz • BCA Notes by Shahid</title><link rel="stylesheet" href="quiz.css"></head><body>
<header><a href="index.html"><b>BCA Notes</b> <small>by Shahid</small></a><a href="index.html">← Home</a></header>
<main><section class="hero"><small>SMART MCQ QUIZ</small><h1>Test your BCA Semester II preparation.</h1><p>10 questions • 10 minutes • instant result • saved progress</p></section>
<section id="start" class="card"><div class="stats"><div><b id="attempts">0</b><span>Attempts</span></div><div><b id="best">0%</b><span>Best Score</span></div><div><b id="last">—</b><span>Last Score</span></div></div>
<label>Choose subject</label><select id="subject"><option value="all">All Subjects</option><option value="os">Operating System & Unix</option><option value="c">Problem Solving & Programming in C</option><option value="sad">System Analysis & Design</option><option value="english">Business English</option><option value="math">Mathematics (Numerical Techniques)</option></select>
<label class="check"><input id="shuffle" type="checkbox" checked> Shuffle questions</label><button id="startBtn">🚀 Start Quiz</button><p class="muted">Scores are saved only in this browser.</p></section>
<section id="quiz" class="card hidden"><div class="top"><span id="count"></span><b id="timer">10:00</b></div><div class="bar"><i id="bar"></i></div><small id="sub"></small><h2 id="question"></h2><div id="options"></div><button id="next" disabled>Next →</button></section>
<section id="result" class="card hidden"><small>QUIZ COMPLETE</small><h2 id="title"></h2><div class="circle" id="score"></div><p id="summary"></p><div id="review"></div><button id="retry">🔁 Try Again</button><button class="secondary" onclick="location.href='index.html'">🏠 Home</button></section></main>
<script src="quiz.js"></script></body></html>
